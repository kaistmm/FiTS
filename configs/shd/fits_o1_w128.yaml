# SHD, best-test protocol (paper Table 1, "SHD": 95.31 ± 0.21 %, 0.04 M params)
data_dir: ./data/SHD            # contains shd_train.h5, shd_test.h5
results_dir: ./runs/shd/fits_o1_w128
eval_mode: test_only

seed: 0
epochs: 100
batch_size: 128
lr: 7.5e-3
wd: 0.0
dropout: 0.5

neuron_type: fits
hidden_dims: [128, 128]
order: 1                        # TS cascade order M (0 = FS only)

# neuron constants (Table A.1)
tau_m: 0.04
tau_a: 0.2
dt: 0.004
f_min: 1.0
f_max: 50.0
freq_init: log
freq_param: ct
freq_guard: true

time_window: 250
in_features: 140
